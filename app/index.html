     from identity.netlify.com whenever the URL fragment carried an Identity
     token, then sent the visitor to /admin/ — the CMS that the React console
     at /console.html replaced. The path has not existed for some time, so the
     block was a third-party script any stranger could trigger on the homepage
     with a link ending #invite_token=anything, in aid of a redirect to a 404.

     Removing it also empties the last inline script out of the build, which
     is what lets script-src 'self' hold.

     Netlify Identity may still be switched on in the Netlify dashboard, and
     that is the part this deletion does NOT fix — see the README. -->
