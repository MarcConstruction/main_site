# Decap CMS — the admin panel.
#
# Git-based: every save is a commit to this repo, so content keeps full history,
# no API keys ship to the browser, and the static build keeps working untouched.
#
# Auth is a GitHub OAuth app, handled by api/auth.js and api/callback.js on
# Vercel. Git Gateway was Netlify-only; this is its replacement. The client
# secret lives in Vercel's environment variables, never in this file.
#
# Editing therefore requires a GitHub account with write access to the repo.
#
# `branch` must match the repo's default branch.

backend:
  name: github
  repo: MarcConstruction/main_site
  branch: main
  base_url: https://www.marcconstruction.in
  auth_endpoint: api/auth
  commit_messages:
    create: 'content: add {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

# ponytail: editorial_workflow is off. It turns every save into a pull request
# with a separate Publish click, which earns its keep when several people edit
# and someone reviews. With a single editor who is also the developer it is
# just an extra step on the way to the same commit. Turn it back on the day a
# second editor arrives.

media_folder: app/public/assets
public_folder: /assets

# Branding. These three are Decap's own options rather than CSS, so they
# survive version bumps: the wordmark replaces Decap's logo on the login
# screen, and the two URLs give editors a link back to the live site.
logo_url: /assets/marc-wordmark-ink.png
site_url: https://www.marcconstruction.in
display_url: https://www.marcconstruction.in

collections:
  # ── Projects ────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    files:
      - name: projects
        label: All projects
        file: app/src/content/projects.json
        description: >-
          The portfolio. MahaRERA values must read exactly as the authority has
          them. "To confirm" is a real state; never invent a number.
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: '{{fields.name}} · {{fields.locality}} ({{fields.status}})'
            fields:
              - { name: slug, label: URL slug, widget: string, hint: 'Used in project.html?p=… Changing it breaks existing links.' }
              - { name: name, label: Name, widget: string }
              - { name: locality, label: Locality, widget: select, options: [Ahilyanagar, Savedi, Nalegaon, Bhistabag, Tarakpur, Borude Mala] }
              - { name: status, label: Status, widget: select, options: [Ongoing, Completed, Upcoming] }
              - { name: type, label: Type, widget: select, options: [Residential, Commercial, Mixed-Use] }
              - name: configs
                label: Configurations
                widget: select
                multiple: true
                options: ['1 BHK', '2 BHK', '3 BHK', '4 BHK', Shop, Office]
                hint: Drives the filters on the projects page.
              - { name: configLabel, label: Configuration label, widget: string, hint: 'How it reads on the page, e.g. "2 & 3 BHK".' }
              - { name: rera, label: MahaRERA number, widget: string, hint: 'Exactly as registered. Use "To confirm" if not yet issued or none exists.' }
              - { name: towers, label: Towers, widget: string, required: false }
              - { name: possession, label: Possession, widget: string, required: false }
              - { name: line, label: Card line, widget: string, required: false }
              - { name: img, label: Main image, widget: image, hint: 'Upload here. The resized versions are generated on deploy.' }
              - name: coords
                label: Map coordinates
                widget: string
                required: false
                pattern: ['^-?\d+\.\d+,-?\d+\.\d+$', 'Use "lat,lng", e.g. 19.1223267,74.7473039']
                hint: >-
                  Open the site in Google Maps, right-click the exact plot, click
                  the lat/lng to copy. Leave empty rather than guessing. An empty
                  field falls back to a locality view.
              - name: plans
                label: Floor plans
                widget: list
                required: false
                fields:
                  - { name: label, label: Floor, widget: string }
                  - { name: img, label: Plan sheet, widget: image }

  # ── Testimonials ────────────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: All testimonials
        file: app/src/content/testimonials.json
        description: Published with full name and locality, so only add with the family's consent.
        fields:
          - name: testimonials
            label: Testimonials
            widget: list
            summary: '{{fields.name}} · {{fields.locality}}'
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Name, widget: string }
              - { name: locality, label: Locality, widget: string }
              - { name: photo, label: Photo, widget: image, required: false }

  # ── About ───────────────────────────────────────────────────────────────
  - name: eras
    label: About · the story
    files:
      - name: eras
        label: Decades
        file: app/src/content/eras.json
        fields:
          - name: eras
            label: Decades
            widget: list
            summary: '{{fields.year}} · {{fields.title}}'
            fields:
              - { name: year, label: Year, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

  # ── Walkthroughs ────────────────────────────────────────────────────────
  - name: walkthroughs
    label: Walkthrough videos
    files:
      - name: walkthroughs
        label: Videos
        file: app/src/content/walkthroughs.json
        fields:
          - name: walkthroughs
            label: Videos
            widget: list
            summary: '{{fields.label}} · {{fields.len}}'
            fields:
              - { name: label, label: Configuration, widget: string }
              - { name: url, label: YouTube URL, widget: string }
              - { name: img, label: Poster image, widget: image }
              - { name: len, label: Length, widget: string }

  # ── Contact details ─────────────────────────────────────────────────────
  - name: site
    label: Contact & legal
    files:
      - name: site
        label: Contact details
        file: app/src/content/site.json
        fields:
          - { name: phone, label: Phone (dial format), widget: string, hint: 'With country code, no spaces, e.g. +919552555621' }
          - { name: phoneDisplay, label: Phone (as displayed), widget: string }
          - { name: whatsapp, label: WhatsApp link, widget: string }
          - name: legal
            label: Footer legal line
            widget: text
            hint: >-
              CIN, MahaRERA and GST appear on every page. Check each against the
              certificates before changing.
